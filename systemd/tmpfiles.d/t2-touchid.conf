# Create the activation journal directory. Age deletion is not used: the
# Python pruner removes only proved-terminal histories.
d /var/lib/t2-touchid/activation 0700 root root -
# Keep the runtime root private at boot; fprintd's RuntimeDirectory would
# otherwise create it 0755 as the parent of t2-touchid/workers.
d /run/t2-touchid 0700 root root -
